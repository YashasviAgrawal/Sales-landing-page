<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760">
  <!--
    Source art for the footer's ASCII sampler, not a visible asset.

    Polarity matters and is easy to get backwards. buildHandCells in
    animated-footer.tsx computes charIndex = (1 - brightness) * ramp.length
    and skips any cell at or below the last "." in the ramp, so:

      white  -> index 0      -> dropped, becomes empty space
      black  -> index 19     -> the densest glyph

    Dark ink draws; light ground disappears. Anything brighter than about 0.6
    luminance (roughly #999) falls into the skipped range and will not render
    at all, so the gradient below deliberately tops out near #6e6e6e and the
    field is pure white.

    The shape is the page's own argument - a funnel carrying volume that
    narrows stage by stage, with the constriction low and tight.
  -->
  <defs>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.45" stop-color="#2e2e2e"/>
      <stop offset="0.78" stop-color="#565656"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="760" fill="#ffffff"/>

  <!-- Funnel body: wide mouth, stepped narrowing, long neck. -->
  <path
    d="M40 70 H560 L470 250 H130 Z
       M150 290 H450 L392 430 H208 Z
       M226 470 H374 L340 590 H260 Z
       M272 630 H328 V740 H272 Z"
    fill="url(#fall)"/>

  <!-- Escaping volume: what leaves at each constriction. -->
  <g fill="#4a4a4a">
    <circle cx="96" cy="292" r="13"/>
    <circle cx="58" cy="340" r="9"/>
    <circle cx="120" cy="360" r="7"/>
    <circle cx="504" cy="292" r="13"/>
    <circle cx="542" cy="340" r="9"/>
    <circle cx="480" cy="360" r="7"/>
    <circle cx="172" cy="486" r="11"/>
    <circle cx="132" cy="536" r="8"/>
    <circle cx="428" cy="486" r="11"/>
    <circle cx="468" cy="536" r="8"/>
  </g>
</svg>
